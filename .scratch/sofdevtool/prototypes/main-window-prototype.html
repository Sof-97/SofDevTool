<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SofDevTool — Main Window Prototype</title>
  <!-- Three variants of the main window and Utility Launcher, switchable via ?variant=A|B|C. THROWAWAY PROTOTYPE. -->
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f4f4f6; --panel: rgba(255,255,255,.82); --solid: #fff;
      --line: rgba(20,24,32,.12); --text: #20232a; --muted: #6b7079;
      --accent: #0969da; --accent-soft: #e8f2ff; --danger: #c7352e;
      --shadow: 0 16px 45px rgba(20,24,32,.16); --radius: 12px;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#17181b; --panel:rgba(38,40,45,.86); --solid:#27292e; --line:rgba(255,255,255,.12); --text:#f1f2f4; --muted:#a4a8b0; --accent:#68a8ff; --accent-soft:#17365b; --danger:#ff746c; --shadow:0 16px 45px rgba(0,0,0,.42); }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text); }
    body { overflow: hidden; }
    button, input, select, textarea { font: inherit; color: inherit; }
    button { cursor: pointer; }
    .app { height: 100vh; padding-top: 28px; }
    .titlebar { position: fixed; inset: 0 0 auto 0; height: 28px; z-index: 20; display:flex; align-items:center; justify-content:center; background: color-mix(in srgb, var(--panel) 92%, transparent); border-bottom: 1px solid var(--line); backdrop-filter: blur(18px); font-size: 12px; font-weight: 600; }
    .traffic { position:absolute; left:12px; display:flex; gap:7px; }
    .traffic i { width:12px; height:12px; border-radius:50%; display:block; }
    .traffic i:nth-child(1){background:#ff5f57}.traffic i:nth-child(2){background:#febc2e}.traffic i:nth-child(3){background:#28c840}
    .chrome-btn, .icon-btn { border:1px solid var(--line); background:var(--panel); border-radius:8px; padding:7px 10px; }
    .chrome-btn:hover, .icon-btn:hover { background:var(--accent-soft); }
    .primary { border:0; background:var(--accent); color:white; padding:8px 12px; border-radius:8px; font-weight:600; }
    .muted { color:var(--muted); }
    .kbd { border:1px solid var(--line); border-bottom-width:2px; border-radius:5px; padding:1px 5px; font-size:11px; color:var(--muted); background:var(--solid); white-space:nowrap; }
    .search { display:flex; align-items:center; gap:8px; border:1px solid var(--line); border-radius:9px; padding:8px 10px; background:var(--solid); }
    .search:focus-within { outline:2px solid color-mix(in srgb,var(--accent) 55%,transparent); }
    .search input { border:0; outline:0; background:transparent; width:100%; }
    .list { list-style:none; margin:0; padding:0; }
    .list button { width:100%; border:0; background:transparent; text-align:left; border-radius:8px; padding:9px 10px; display:flex; gap:9px; align-items:center; }
    .list button:hover, .list button.selected { background:var(--accent-soft); color:var(--text); }
    .glyph { width:27px; height:27px; border-radius:7px; display:grid; place-items:center; flex:0 0 auto; background:linear-gradient(145deg,var(--accent-soft),var(--solid)); border:1px solid var(--line); font-size:13px; font-weight:700; }
    .badge { font-size:11px; border:1px solid var(--line); color:var(--muted); border-radius:999px; padding:2px 7px; }
    .workspace { min-width:0; overflow:auto; }
    .utility-head { display:flex; justify-content:space-between; gap:16px; align-items:flex-start; margin-bottom:18px; }
    .utility-head h1 { font-size:24px; margin:0 0 4px; letter-spacing:-.02em; }
    .segmented { display:inline-flex; border:1px solid var(--line); border-radius:8px; padding:2px; background:var(--panel); }
    .segmented button { border:0; background:transparent; padding:5px 10px; border-radius:6px; }
    .segmented button.active { background:var(--solid); box-shadow:0 1px 4px rgba(0,0,0,.14); }
    .editor-grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; min-height:280px; }
    .editor { border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; background:var(--solid); display:flex; flex-direction:column; }
    .editor-label { padding:9px 11px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; font-size:12px; font-weight:600; }
    textarea { border:0; outline:0; resize:none; flex:1; min-height:220px; padding:14px; background:transparent; font-family:"SFMono-Regular",Consolas,monospace; font-size:13px; line-height:1.55; }
    .output { padding:14px; white-space:pre-wrap; font-family:"SFMono-Regular",Consolas,monospace; font-size:13px; line-height:1.55; }
    .error { margin-top:10px; border:1px solid color-mix(in srgb,var(--danger) 40%,var(--line)); background:color-mix(in srgb,var(--danger) 9%,var(--solid)); color:var(--danger); border-radius:8px; padding:10px; font-size:13px; }
    .empty { min-height:220px; display:grid; place-items:center; text-align:center; color:var(--muted); padding:30px; }
    .empty strong { display:block; color:var(--text); margin-bottom:5px; }

    /* Variant A: classic three-column library */
    .variant-a { display:grid; grid-template-columns:220px minmax(430px,1fr) 230px; height:calc(100vh - 28px); }
    .a-sidebar { background:color-mix(in srgb,var(--panel) 94%,transparent); border-right:1px solid var(--line); padding:14px 10px; overflow:auto; }
    .a-sidebar .search { margin-bottom:15px; }
    .section-label { text-transform:uppercase; font-size:10px; letter-spacing:.08em; color:var(--muted); font-weight:700; margin:15px 10px 5px; }
    .nav-row { padding:7px 10px; border-radius:7px; font-size:13px; display:flex; justify-content:space-between; }
    .nav-row.active { background:var(--accent-soft); font-weight:600; }
    .a-workspace { padding:25px 28px 90px; }
    .a-inspector { border-left:1px solid var(--line); padding:18px 15px; background:var(--panel); overflow:auto; }
    .recent-card { padding:10px 0; border-bottom:1px solid var(--line); font-size:12px; }

    /* Variant B: searchable home, then a focused utility sheet */
    .variant-b { height:calc(100vh - 28px); overflow:auto; padding:34px max(28px,calc((100vw - 1040px)/2)) 100px; }
    .b-top { display:flex; justify-content:space-between; align-items:center; }
    .b-hero { text-align:center; margin:54px auto 30px; max-width:680px; }
    .b-hero h1 { font-size:32px; margin:0 0 9px; letter-spacing:-.035em; }
    .b-hero .search { padding:12px 14px; box-shadow:0 8px 28px rgba(0,0,0,.08); }
    .b-section { margin-top:30px; }
    .b-section h2 { font-size:14px; margin:0 0 12px; }
    .card-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; }
    .utility-card { border:1px solid var(--line); background:var(--panel); border-radius:14px; padding:15px; min-height:124px; text-align:left; display:flex; flex-direction:column; gap:9px; }
    .utility-card:hover, .utility-card.selected { border-color:var(--accent); background:var(--accent-soft); }
    .utility-card strong { font-size:14px; }
    .utility-card small { color:var(--muted); line-height:1.35; }
    .b-recents { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
    .b-recent { border:1px solid var(--line); background:var(--solid); border-radius:10px; padding:11px 13px; display:flex; justify-content:space-between; }

    /* Variant C: dense keyboard workbench */
    .variant-c { height:calc(100vh - 28px); display:grid; grid-template-rows:48px 1fr; }
    .c-toolbar { border-bottom:1px solid var(--line); background:var(--panel); display:flex; align-items:center; gap:10px; padding:7px 12px; }
    .c-toolbar .search { flex:1; max-width:520px; margin:auto; padding:6px 9px; }
    .c-body { display:grid; grid-template-columns:310px 1fr; min-height:0; }
    .c-list { border-right:1px solid var(--line); overflow:auto; background:var(--solid); }
    .c-list-head { position:sticky; top:0; background:var(--solid); border-bottom:1px solid var(--line); padding:10px 12px; display:flex; justify-content:space-between; z-index:2; }
    .c-group { padding:6px 8px 10px; }
    .c-row { display:grid; grid-template-columns:28px 1fr auto; gap:8px; align-items:center; padding:8px; border-radius:7px; font-size:13px; }
    .c-row.selected { background:var(--accent-soft); }
    .c-workspace { padding:21px 25px 90px; }

    .overlay { position:fixed; inset:28px 0 0; z-index:50; background:rgba(0,0,0,.28); display:none; place-items:start center; padding-top:11vh; backdrop-filter:blur(3px); }
    .overlay.open { display:grid; }
    .launcher { width:min(650px,calc(100vw - 32px)); border:1px solid var(--line); border-radius:15px; background:var(--solid); box-shadow:var(--shadow); overflow:hidden; }
    .launcher-search { padding:14px; border-bottom:1px solid var(--line); display:flex; gap:10px; }
    .launcher-search input { width:100%; border:0; outline:0; background:transparent; font-size:16px; }
    .launcher-results { padding:7px; max-height:360px; overflow:auto; }
    .launcher-row { display:grid; grid-template-columns:32px 1fr auto; gap:10px; align-items:center; padding:10px; border-radius:8px; }
    .launcher-row.active { background:var(--accent); color:white; }
    .launcher-row small { display:block; opacity:.72; margin-top:2px; }
    .launcher-foot { border-top:1px solid var(--line); padding:8px 12px; color:var(--muted); font-size:11px; display:flex; justify-content:space-between; }
    .sheet { position:fixed; right:0; top:28px; bottom:0; z-index:55; width:min(440px,100vw); background:var(--solid); border-left:1px solid var(--line); box-shadow:var(--shadow); padding:22px; transform:translateX(105%); transition:.18s ease; }
    .sheet.open { transform:none; }
    .sheet-head { display:flex; justify-content:space-between; align-items:center; }
    .setting { display:flex; justify-content:space-between; gap:20px; padding:16px 0; border-bottom:1px solid var(--line); }
    .toggle { width:39px; height:23px; border-radius:99px; background:var(--accent); border:0; position:relative; flex:0 0 auto; }
    .toggle::after { content:""; width:18px; height:18px; background:white; border-radius:50%; position:absolute; right:2px; top:2.5px; }
    .prototype-bar { position:fixed; z-index:100; left:50%; bottom:18px; transform:translateX(-50%); background:#15171b; color:white; border:1px solid rgba(255,255,255,.18); box-shadow:var(--shadow); border-radius:999px; padding:6px; display:flex; gap:5px; align-items:center; }
    .prototype-bar button { border:0; color:white; background:transparent; min-width:34px; height:32px; border-radius:999px; }
    .prototype-bar button:hover { background:rgba(255,255,255,.14); }
    .prototype-label { min-width:220px; text-align:center; font-size:12px; }
    .prototype-label strong { display:block; font-size:13px; }
    .state-panel { position:fixed; z-index:40; right:12px; top:40px; border:1px solid var(--line); background:var(--panel); backdrop-filter:blur(16px); border-radius:9px; padding:8px 10px; font:11px/1.4 "SFMono-Regular",monospace; color:var(--muted); pointer-events:none; }
    .state-panel b { color:var(--text); }
    @media (max-width:850px) { .variant-a{grid-template-columns:190px 1fr}.a-inspector{display:none}.card-grid{grid-template-columns:repeat(2,1fr)}.c-body{grid-template-columns:245px 1fr}.editor-grid{grid-template-columns:1fr}.b-recents{grid-template-columns:1fr} }
  </style>
</head>
<body>
  <div class="titlebar"><span class="traffic"><i></i><i></i><i></i></span>SofDevTool · Throwaway Prototype</div>
  <main id="root" class="app"></main>
  <div id="launcherOverlay" class="overlay" aria-hidden="true"></div>
  <aside id="settingsSheet" class="sheet" aria-hidden="true"></aside>
  <div id="statePanel" class="state-panel"></div>
  <nav class="prototype-bar" aria-label="Prototype variant switcher">
    <button id="previousVariant" aria-label="Previous variant">←</button>
    <span class="prototype-label"><small>PROTOTYPE VARIANT</small><strong id="variantLabel"></strong></span>
    <button id="nextVariant" aria-label="Next variant">→</button>
  </nav>
  <script>
    const utilities = [
      ['JSON','Format, validate, minify, and query','Format & Convert','{ }'],
      ['YAML ↔ JSON','Convert a single YAML 1.2 document','Format & Convert','Y'],
      ['Base64 & URL','Encode and decode UTF-8 text','Encode & Decode','64'],
      ['Hashes','SHA family and legacy digests','Encode & Decode','#'],
      ['Identifier Generator','UUID, ULID, and KSUID','Generate','ID'],
      ['Random String','Generate cryptographic random strings','Generate','Aa'],
      ['Sample Data','Create fictional JSON or CSV rows','Generate','▦'],
      ['Timestamps','Convert Unix, ISO 8601, UTC, and local','Inspect','◷'],
      ['JWT Decoder','Decode readable JWT segments','Inspect','JWT'],
      ['Regex','Test patterns and preview replacements','Inspect','.*'],
      ['Text Diff','Compare text in unified or split views','Compare','±'],
      ['Case Conversion','Transform naming and title cases','Text','aA'],
      ['Whitespace','Apply explicit whitespace operations','Text','¶'],
      ['Color Conversion','Convert sRGB HEX, RGB, and HSL','Format & Convert','●']
    ].map((u,i)=>({name:u[0],description:u[1],category:u[2],glyph:u[3],favorite:[0,4,10].includes(i)}));
    const state = { variant:'A', selected:'JSON', query:'', launcher:false, settings:false, launcherIndex:0, demo:'normal', homeUtility:false };
    const names = { A:'Library · browse first', B:'Home · search first', C:'Workbench · keyboard first' };
    const sample = '{\n  "project": "SofDevTool",\n  "localOnly": true,\n  "utilities": 14\n}';

    const esc = s => s.replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
    const filtered = () => utilities.filter(u => (u.name+' '+u.description+' '+u.category).toLowerCase().includes(state.query.toLowerCase()));
    const searchBox = (placeholder='Search Utilities') => `<label class="search">⌕<input data-search value="${esc(state.query)}" placeholder="${placeholder}" aria-label="${placeholder}"><span class="kbd">⌘K</span></label>`;
    const settingsButton = () => `<button class="chrome-btn" data-settings>⚙ Settings</button>`;
    const glyph = u => `<span class="glyph">${u.glyph}</span>`;
    const emptyState = () => `<div class="empty"><div><strong>No Utilities found</strong>Try a name, category, or operation such as “encode”.<br><button class="chrome-btn" data-clear-search style="margin-top:12px">Clear search</button></div></div>`;
    const utilityWorkspace = (compact=false) => {
      const u = utilities.find(x=>x.name===state.selected) || utilities[0];
      const bad = state.demo==='error';
      return `<section class="workspace ${compact?'c-workspace':''}">
        <header class="utility-head"><div><div class="muted" style="font-size:12px">${u.category}</div><h1>${u.name}</h1><div class="muted">${u.description}</div></div><button class="icon-btn" title="Favorite">${u.favorite?'★':'☆'}</button></header>
        <div style="display:flex;justify-content:space-between;gap:12px;margin-bottom:12px"><div class="segmented"><button class="active">Format</button><button>Minify</button><button>Query</button></div><div><button class="chrome-btn" data-demo-error>${bad?'Show valid input':'Show error state'}</button> <button class="primary">Copy Result</button></div></div>
        <div class="editor-grid"><div class="editor"><div class="editor-label"><span>INPUT</span><span class="muted">JSON · live</span></div><textarea aria-label="Utility input">${bad?'{ "project": SofDevTool }':sample}</textarea></div>
        <div class="editor"><div class="editor-label"><span>${bad?'DIAGNOSTIC':'RESULT'}</span><span class="muted">${bad?'No stale output':'Formatted'}</span></div>${bad?`<div style="padding:14px"><div class="error"><strong>Expected a string value</strong><br>Line 1, column 14 · Wrap <code>SofDevTool</code> in quotation marks.</div></div>`:`<div class="output">${esc(sample)}</div>`}</div></div>
      </section>`;
    };

    function variantA(){
      const rows = filtered();
      const groups = [...new Set(utilities.map(u=>u.category))];
      return `<div class="variant-a"><aside class="a-sidebar">${searchBox()}<div class="section-label">Library</div><div class="nav-row active">All Utilities <span>14</span></div><div class="nav-row">Favorites <span>3</span></div><div class="nav-row">Recent <span>4</span></div><div class="section-label">Categories</div>${groups.map(g=>`<div class="nav-row">${g}<span>${utilities.filter(u=>u.category===g).length}</span></div>`).join('')}<div class="section-label">Utilities</div><ul class="list">${rows.slice(0,7).map(u=>`<li><button class="${u.name===state.selected?'selected':''}" data-select="${u.name}">${glyph(u)}<span>${u.name}</span></button></li>`).join('')}</ul><div style="margin-top:18px">${settingsButton()}</div></aside><div class="a-workspace">${rows.length?utilityWorkspace():emptyState()}</div><aside class="a-inspector"><div style="display:flex;justify-content:space-between;align-items:center"><strong>Recent</strong><span class="badge">History on</span></div>${['JSON · 2 min ago','Identifier Generator · 18 min ago','Base64 & URL · Yesterday'].map(x=>`<div class="recent-card">${x}<div class="muted">Open previous operation ↗</div></div>`).join('')}<div class="section-label" style="margin-left:0">Prototype notes</div><p class="muted" style="font-size:12px;line-height:1.5">Stable categories stay visible. Search narrows the current library. History is adjacent but visually secondary.</p></aside></div>`;
    }
    function variantB(){
      const rows=filtered();
      if(state.homeUtility) return `<div class="variant-b"><header class="b-top"><button class="chrome-btn" data-home>← All Utilities</button><div><button class="chrome-btn" data-launcher>Open Launcher <span class="kbd">⌃⌥Space</span></button> ${settingsButton()}</div></header><div style="margin-top:30px">${utilityWorkspace()}</div></div>`;
      return `<div class="variant-b"><header class="b-top"><strong>SofDevTool</strong><div><button class="chrome-btn" data-launcher>Open Launcher <span class="kbd">⌃⌥Space</span></button> ${settingsButton()}</div></header><section class="b-hero"><h1>What do you need to do?</h1><p class="muted">Find a Utility by name or intent.</p>${searchBox('Format, encode, compare, generate…')}</section>${rows.length?`<section class="b-section"><h2>${state.query?'Search results':'Favorites'}</h2><div class="card-grid">${(state.query?rows:utilities.filter(u=>u.favorite).concat([utilities[2]])).map(u=>`<button class="utility-card ${u.name===state.selected?'selected':''}" data-select="${u.name}">${glyph(u)}<strong>${u.name}</strong><small>${u.description}</small></button>`).join('')}</div></section><section class="b-section"><h2>Continue where you left off</h2><div class="b-recents"><div class="b-recent"><span><strong>JSON</strong><br><small class="muted">2 min ago</small></span><span>→</span></div><div class="b-recent"><span><strong>Identifier Generator</strong><br><small class="muted">18 min ago</small></span><span>→</span></div><div class="b-recent"><span><strong>Base64 & URL</strong><br><small class="muted">Yesterday</small></span><span>→</span></div></div></section>`:emptyState()}</div>`;
    }
    function variantC(){
      const rows=filtered();
      const groups=[...new Set(rows.map(u=>u.category))];
      return `<div class="variant-c"><header class="c-toolbar"><div class="segmented"><button class="active">Library</button><button>Recent</button><button>Favorites</button></div>${searchBox('Jump to a Utility…')}<button class="icon-btn" data-launcher title="Utility Launcher">⌁</button><button class="icon-btn" data-settings title="Settings">⚙</button></header><div class="c-body"><aside class="c-list"><div class="c-list-head"><strong>${state.query?'Matches':'All Utilities'}</strong><span class="badge">${rows.length}</span></div>${rows.length?groups.map(g=>`<div class="c-group"><div class="section-label">${g}</div>${rows.filter(u=>u.category===g).map((u,i)=>`<div class="c-row ${u.name===state.selected?'selected':''}" data-select="${u.name}" tabindex="0">${glyph(u)}<span><strong>${u.name}</strong><br><small class="muted">${u.description}</small></span>${u.favorite?'★':''}</div>`).join('')}</div>`).join(''):emptyState()}</aside>${utilityWorkspace(true)}</div></div>`;
    }

    function render(){
      document.getElementById('root').innerHTML = state.variant==='A'?variantA():state.variant==='B'?variantB():variantC();
      document.getElementById('variantLabel').textContent = `${state.variant} — ${names[state.variant]}`;
      document.getElementById('statePanel').innerHTML = `<b>VISIBLE STATE</b><br>variant: ${state.variant}<br>selected: ${state.selected}<br>query: ${state.query||'∅'}<br>launcher: ${state.launcher}<br>settings: ${state.settings}`;
      wire(); renderLauncher(); renderSettings();
    }
    function wire(){
      document.querySelectorAll('[data-search]').forEach(input=>input.addEventListener('input',e=>updateSearch(e.target.value)));
      document.querySelectorAll('[data-select]').forEach(el=>el.addEventListener('click',()=>{state.selected=el.dataset.select;state.query='';if(state.variant==='B')state.homeUtility=true;render()}));
      document.querySelectorAll('[data-settings]').forEach(el=>el.addEventListener('click',()=>{state.settings=true;renderSettings();renderState()}));
      document.querySelectorAll('[data-launcher]').forEach(el=>el.addEventListener('click',openLauncher));
      document.querySelectorAll('[data-clear-search]').forEach(el=>el.addEventListener('click',()=>{state.query='';render()}));
      document.querySelectorAll('[data-demo-error]').forEach(el=>el.addEventListener('click',()=>{state.demo=state.demo==='error'?'normal':'error';render()}));
      document.querySelectorAll('[data-home]').forEach(el=>el.addEventListener('click',()=>{state.homeUtility=false;render()}));
    }
    function updateSearch(value){state.query=value;render();const next=document.querySelector('[data-search]');if(next){next.focus();next.setSelectionRange(value.length,value.length)}}
    function renderState(){ document.getElementById('statePanel').innerHTML=`<b>VISIBLE STATE</b><br>variant: ${state.variant}<br>selected: ${state.selected}<br>query: ${state.query||'∅'}<br>launcher: ${state.launcher}<br>settings: ${state.settings}`; }
    function renderLauncher(){
      const overlay=document.getElementById('launcherOverlay'); overlay.classList.toggle('open',state.launcher); overlay.setAttribute('aria-hidden',String(!state.launcher));
      if(!state.launcher){overlay.innerHTML='';return}
      const matches=filtered(); state.launcherIndex=Math.min(state.launcherIndex,Math.max(0,matches.length-1));
      overlay.innerHTML=`<div class="launcher" role="dialog" aria-label="Utility Launcher"><div class="launcher-search">⌕<input id="launcherInput" value="${esc(state.query)}" placeholder="Search Utilities" autocomplete="off"><span class="kbd">esc</span></div><div class="launcher-results">${matches.length?matches.map((u,i)=>`<div class="launcher-row ${i===state.launcherIndex?'active':''}" data-launch-select="${u.name}">${glyph(u)}<div><strong>${u.name}</strong><small>${u.description} · ${u.category}</small></div>${u.favorite?'★':''}</div>`).join(''):emptyState()}</div><div class="launcher-foot"><span><span class="kbd">↑↓</span> move &nbsp; <span class="kbd">↩</span> open</span><span>Utilities open in the main window</span></div></div>`;
      const input=document.getElementById('launcherInput'); input.focus(); input.setSelectionRange(input.value.length,input.value.length);
      input.addEventListener('input',e=>{state.query=e.target.value;state.launcherIndex=0;renderLauncher();renderState()});
      overlay.querySelectorAll('[data-launch-select]').forEach(el=>el.addEventListener('click',()=>selectFromLauncher(el.dataset.launchSelect)));
      overlay.addEventListener('mousedown',e=>{if(e.target===overlay)closeLauncher()});
    }
    function renderSettings(){
      const sheet=document.getElementById('settingsSheet'); sheet.classList.toggle('open',state.settings); sheet.setAttribute('aria-hidden',String(!state.settings));
      sheet.innerHTML=`<div class="sheet-head"><div><div class="muted" style="font-size:12px">SofDevTool</div><h2 style="margin:3px 0">Settings</h2></div><button class="icon-btn" id="closeSettings">✕</button></div><div class="setting"><div><strong>Utility Launcher shortcut</strong><div class="muted">Open the launcher from anywhere on this Mac.</div></div><span class="kbd">⌃⌥Space</span></div><div class="setting"><div><strong>Utility History</strong><div class="muted">Keep up to 25 operations per Utility on this Mac.</div></div><button class="toggle" aria-label="History enabled"></button></div><div class="setting"><div><strong>Appearance</strong><div class="muted">Follow the system appearance.</div></div><select><option>System</option><option>Light</option><option>Dark</option></select></div><p class="muted" style="font-size:12px;margin-top:24px">In every variant, Settings is a separate destination presented without replacing the current Utility. This is one relationship to validate—not a final implementation.</p>`;
      const close=document.getElementById('closeSettings'); if(close) close.onclick=()=>{state.settings=false;renderSettings();renderState()};
    }
    function openLauncher(){state.launcher=true;state.query='';state.launcherIndex=0;renderLauncher();renderState()}
    function closeLauncher(){state.launcher=false;state.query='';renderLauncher();renderState()}
    function selectFromLauncher(name){state.selected=name;state.launcher=false;state.query='';if(state.variant==='B')state.homeUtility=true;render()}
    function cycle(delta){const keys=['A','B','C'];state.variant=keys[(keys.indexOf(state.variant)+delta+keys.length)%keys.length];history.replaceState({},'',`?variant=${state.variant}`);render()}
    document.getElementById('previousVariant').onclick=()=>cycle(-1); document.getElementById('nextVariant').onclick=()=>cycle(1);
    document.addEventListener('keydown',e=>{
      const editing=['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName)||document.activeElement?.isContentEditable;
      if(e.key==='Escape'){if(state.launcher)closeLauncher();else if(state.settings){state.settings=false;renderSettings();renderState()}return}
      if((e.metaKey&&e.key.toLowerCase()==='k')||(e.ctrlKey&&e.altKey&&e.code==='Space')){e.preventDefault();openLauncher();return}
      if(state.launcher){const rows=filtered();if(e.key==='ArrowDown'){e.preventDefault();state.launcherIndex=Math.min(rows.length-1,state.launcherIndex+1);renderLauncher()}if(e.key==='ArrowUp'){e.preventDefault();state.launcherIndex=Math.max(0,state.launcherIndex-1);renderLauncher()}if(e.key==='Enter'&&rows[state.launcherIndex])selectFromLauncher(rows[state.launcherIndex].name);return}
      if(!editing&&(e.key.toLowerCase()==='j'||e.key.toLowerCase()==='k')){const rows=filtered();const current=Math.max(0,rows.findIndex(u=>u.name===state.selected));const next=Math.max(0,Math.min(rows.length-1,current+(e.key.toLowerCase()==='j'?1:-1)));if(rows[next]){state.selected=rows[next].name;render()}return}
      if(!editing&&e.key==='ArrowLeft')cycle(-1); if(!editing&&e.key==='ArrowRight')cycle(1);
    });
    const requested=new URLSearchParams(location.search).get('variant'); if(['A','B','C'].includes(requested))state.variant=requested; render();
  </script>
</body>
