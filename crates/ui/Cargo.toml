[package]
name = "sofui"
description = "Reusable GPUI components and component interaction logic."
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
readme = "README.md"
publish = false

[dependencies]
gpui = { package = "gpui-pre", version = "=0.3.6" }
gpui-component = "=0.6.6"
unicode-segmentation = "=1.13.3"

[dev-dependencies]
gpui = { package = "gpui-pre", version = "=0.3.6", features = ["test-support"] }
gpui-platform = { package = "gpui-pre-platform", version = "=0.3.6", features = ["font-kit", "runtime_shaders"] }

[[example]]
name = "gallery"
path = "examples/gallery.rs"
